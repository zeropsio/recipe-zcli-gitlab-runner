zerops:
  - setup: zclirunner
    run:
      os: ubuntu
      base: ubuntu@26.04
      prepareCommands:
        - sudo apt update && sudo apt install -y git zip gcc bzr make
        - |
          # Download the binary for your system
          sudo curl -L --output /usr/local/bin/gitlab-runner https://gitlab-runner-downloads.s3.amazonaws.com/latest/binaries/gitlab-runner-linux-amd64
          
          # Give it permission to execute
          sudo chmod +x /usr/local/bin/gitlab-runner
          
          # Create a GitLab Runner user
          sudo useradd --comment 'GitLab Runner' --shell /bin/bash --create-home --user-group gitlab-runner
          
          # Install as a service
          sudo gitlab-runner install --user=gitlab-runner --working-directory=/home/gitlab-runner

          # Prepare environment
          sudo rm -f "/home/gitlab-runner/.bash_logout"
          
          # Create builds directory
          sudo mkdir -p /home/gitlab-runner/builds
          sudo chown -R gitlab-runner:gitlab-runner /home/gitlab-runner/

      initCommands:
        # To re-run the initialization, remove the `initialized` file and restart the service in Zerops
        - |
          if [ -f 'initialized' ]; then exit 0; fi
          sudo gitlab-runner start
          sudo gitlab-runner unregister --name "${ZEROPS_StackName?:}-${ZEROPS_Number?:}" || true
          sudo gitlab-runner register --non-interactive --url "${GITLAB_URL?:}" --token "${GITLAB_TOKEN?:}" --executor shell --name "${ZEROPS_StackName?:}-${ZEROPS_Number?:}"
          touch initialized

      # https://docs.gitlab.com/runner/commands/#gitlab-runner-status
      # The exit code is zero when the service is running and non-zero when the service is not running.
      healthCheck:
        exec:
          command: gitlab-runner status
